name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not ubuntu-latest: the glibc version of the runner becomes the
          # floor for every downstream user. 24.04 links against GLIBC_2.39,
          # which excludes Debian 12, Ubuntu 22.04 and node:20-slim images.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: keysink-x86_64-unknown-linux-gnu
            # Only one matrix leg generates release notes: every leg calls the
            # publish action, and generate_release_notes appends its section to
            # the body on each call — N legs meant N duplicate "Full Changelog" lines.
            notes: true
          # Native arm64 runner: cross-compiling ring (rustls) from x86_64 needs
          # a full cross toolchain and is fragile; public repos get arm64 runners for free.
          # Consequence: the arm64 binary inherits Ubuntu 24.04's glibc 2.39 floor
          # (no 22.04 arm64 runner exists yet). Documented in npm/README.md.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: keysink-aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: keysink-x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: keysink-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: keysink-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          dir="target/${{ matrix.target }}/release"
          tar -C "$dir" -czf "${{ matrix.artifact }}.tar.gz" keysink
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/keysink.exe" -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
      # CHANGELOG.md is the single source of truth for release notes; GitHub's
      # auto-generated notes have nothing to diff against for a first release
      # (no previous tag, direct pushes instead of PRs) and degrade to a bare
      # "Full Changelog" link.
      - name: extract changelog section
        if: matrix.notes == true && startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          section=$(awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$section"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.*
          body: ${{ steps.changelog.outputs.body }}

  # Publishes the same binaries to npm as one self-contained package: every
  # platform lives in vendor/<platform>-<arch>/ inside `keysink`, so installing
  # needs only the npm registry (mirror-friendly) and runs no install scripts.
  # Version numbers come from Cargo.toml, so tagging is the only release action.
  #
  # Gated on the NPM_PUBLISH repository variable: npm requires a trusted
  # publisher to be configured per package on npmjs.com, which can only happen
  # after the first manual publish. Until NPM_PUBLISH=true is set, tag releases
  # skip this job instead of failing red. Setup steps: npm/README.md.
  npm:
    name: publish npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: keysink-*
          path: npm-artifacts
          merge-multiple: true
      - name: stage packages
        run: bash scripts/npm-pack.sh --from-artifacts npm-artifacts
      - name: publish
        run: bash scripts/npm-publish.sh
