name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not ubuntu-latest: the glibc version of the runner becomes the
          # floor for every downstream user. 24.04 links against GLIBC_2.39,
          # which excludes Debian 12, Ubuntu 22.04 and node:20-slim images.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: keysink-x86_64-unknown-linux-gnu
            # Only one matrix leg generates release notes: every leg calls the
            # publish action, and generate_release_notes appends its section to
            # the body on each call — N legs meant N duplicate "Full Changelog" lines.
            notes: true
          # Native arm64 runner: cross-compiling ring (rustls) from x86_64 needs
          # a full cross toolchain and is fragile; public repos get arm64 runners for free.
          # Consequence: the arm64 binary inherits Ubuntu 24.04's glibc 2.39 floor
          # (no 22.04 arm64 runner exists yet). Documented in npm/README.md.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: keysink-aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: keysink-x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: keysink-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: keysink-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          dir="target/${{ matrix.target }}/release"
          tar -C "$dir" -czf "${{ matrix.artifact }}.tar.gz" keysink
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/keysink.exe" -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
      # CHANGELOG.md is the single source of truth for release notes; GitHub's
      # auto-generated notes have nothing to diff against for a first release
      # (no previous tag, direct pushes instead of PRs) and degrade to a bare
      # "Full Changelog" link.
      - name: extract changelog section
        if: matrix.notes == true && startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          section=$(awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$section"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.*
          body: ${{ steps.changelog.outputs.body }}

  # Publishes the crate to crates.io through trusted publishing (OIDC): the repo
  # holds no CARGO_REGISTRY_TOKEN, the workflow trades a short-lived OIDC token
  # for a 30-minute publish token. crates.io verifies repository + workflow name,
  # so this job only works while release.yml keeps its name and the trusted
  # publisher entry stays configured (Settings → Trusted Publishing).
  #
  # Gated on the CRATES_PUBLISH repository variable, same shape as NPM_PUBLISH:
  # the entry can only be added by a crate owner from the web UI, and a tag
  # release should not go red while that is still pending. Until CRATES_PUBLISH
  # is set to true, tag releases skip this job. Setup: docs/publishing.md.
  crates:
    name: publish crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token, exchanged for a crates.io publish token
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Re-pushing a tag, or re-running the job after a network blip, must not
      # try to publish twice: crates.io versions are immutable and a second
      # upload of the same version is a hard failure. Mirrors
      # scripts/npm-publish.sh, which skips versions already on the registry.
      #
      # The tag/version assertion is the last guard against shipping a binary
      # named v0.3.0 while Cargo.toml still says 0.2.2 — the npm side only
      # checks that its manifest agrees with Cargo.toml, not with the tag.
      - name: check registry
        id: gate
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          # curl -f turns HTTP 404 into exit 22, so only that means "not
          # published yet"; any other failure is the API being unreachable and
          # must not be read as a green light to upload.
          status=0
          curl -sf -A "keysink-release-ci" \
            "https://crates.io/api/v1/crates/keysink/$version" >/dev/null || status=$?
          case "$status" in
            0)  echo "skip keysink@$version (already published)" ;;
            22) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)  echo "crates.io API unreachable (curl exit $status); refusing to guess" >&2
                exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.gate.outputs.publish == 'true'
        id: auth
      - name: publish
        if: steps.gate.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Publishes the same binaries to npm as one self-contained package: every
  # platform lives in vendor/<platform>-<arch>/ inside `keysink`, so installing
  # needs only the npm registry (mirror-friendly) and runs no install scripts.
  # Version numbers come from Cargo.toml, so tagging is the only release action.
  #
  # Gated on the NPM_PUBLISH repository variable: npm requires a trusted
  # publisher to be configured per package on npmjs.com, which can only happen
  # after the first manual publish. Until NPM_PUBLISH=true is set, tag releases
  # skip this job instead of failing red. Setup steps: npm/README.md.
  npm:
    name: publish npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: keysink-*
          path: npm-artifacts
          merge-multiple: true
      - name: stage packages
        run: bash scripts/npm-pack.sh --from-artifacts npm-artifacts
      - name: publish
        run: bash scripts/npm-publish.sh
