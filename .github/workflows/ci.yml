name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --locked --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        # --workspace: the perf harness (perf/ksbench) is a workspace member, not
        # an example, so the root package's --all-targets no longer covers it.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: npm packaging scripts
        run: |
          bash -n scripts/npm-pack.sh
          bash -n scripts/npm-publish.sh
          node --check npm/keysink/bin/keysink.js
          node -e "JSON.parse(require('node:fs').readFileSync('npm/keysink/package.json', 'utf8'))"
      # The tracked launcher manifest is committed, so a release commit that bumps
      # Cargo.toml but not it would publish a correct version while leaving the
      # repo lying about it. npm-pack.sh writes the file back only in the runner.
      - name: npm manifest matches Cargo.toml
        run: bash scripts/npm-pack.sh --check-version
