[package]
name = "keysink"
version = "0.1.1"
edition = "2024"
description = "Local credential gateway: virtual key → upstream endpoint + real-credential byte-level passthrough, with an age-encrypted centralized vault"
license = "MIT"
repository = "https://github.com/wusende/keysink"
homepage = "https://github.com/wusende/keysink#readme"
keywords = ["api-keys", "secrets", "credential", "proxy", "llm"]
categories = ["authentication", "command-line-utilities", "network-programming"]
exclude = ["fuzz/corpus", "fuzz/artifacts", "scripts"]

[dependencies]
age = "0.12"
arc-swap = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = "0.3"
http-body-util = "0.1"
httpdate = "1"
# Serve loop drives hyper-util's auto builder directly (see proxy::serve_inbound):
# axum::serve exposes no header_read_timeout, so a client stalling mid-head
# cannot be reaped.
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "service", "tokio"] }
libc = "0.2"
memchr = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
# Explicit ring crypto provider for rustls: avoids aws-lc-rs (cmake to build)
# and keeps the provider already proven on all release targets.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7"
scrypt = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
# start_paused (auto-advancing timers) for the stream-idle unit tests;
# dev-only: the released build keeps tokio's production features.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
